# =============================================================================
#  Matrix Element Call Recorder — nginx example
#  Version 2.0.1
#
#  WHERE THIS GOES
#    Paste the three locations below into the `server { }` block that already
#    serves your Element Web / Matrix domain (TLS, HSTS, Element static files).
#    On Debian/Ubuntu that is usually:
#        /etc/nginx/sites-available/<your-site>   (symlinked into sites-enabled)
#    On RHEL/Alma it is usually:
#        /etc/nginx/conf.d/<your-site>.conf
#    Then:  nginx -t && systemctl reload nginx
#
#  WHAT MUST BE TRUE FIRST
#    1. The plugin stack is installed and running:
#           bash install.sh --install /root/answers.env
#       In overlay mode rec-controller and rec-portal publish nothing by
#       default unless PUBLISH_LOOPBACK_PORTS is true (it is, by default),
#       which binds them to 127.0.0.1 only. Check with:
#           ss -lntp | grep -E ':(8765|8899)\b'
#    2. If nginx runs in a container instead of on the host, 127.0.0.1 is
#       wrong. Use the service names on the shared docker network instead:
#           proxy_pass http://rec-controller:8765/;
#           proxy_pass http://rec-portal:8899/;
#
#  WHY THERE ARE NO PRIORITIES HERE
#    The Traefik variant needs explicit priorities (100 / 90) because
#    PathPrefix(`/recording`) also matches /recordings. nginx picks the longest
#    matching prefix, so `location /recording/` never captures /recordings/ -
#    no priority or ordering tricks required.
# =============================================================================

# --- 1. Recording controller API ---------------------------------------------
# The button calls (same origin as Element Web):
#     POST /recording/api/record/start
#     POST /recording/api/record/stop
#     GET  /recording/api/record/status?roomId=...
#     GET  /recording/health
# The controller itself serves /api/record/... and /health, so the /recording
# prefix has to be stripped. On proxy_pass the trailing slash does exactly
# that; without it every call above would 404.
location = /recording {
    return 308 /recording/;
}

location /recording/ {
    proxy_pass http://127.0.0.1:8765/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Authorization: Bearer <matrix access token> must reach the controller.
    # nginx forwards it by default - do not strip it here. The controller
    # resolves it through /_matrix/client/v3/account/whoami and then checks
    # the caller's room power level before accepting a start.
    #
    # No raised proxy_read_timeout is needed: /api/record/stop answers 202
    # immediately and finalization happens asynchronously in the worker and
    # the publisher, with the UI polling /api/record/status.
}

# --- 2. Recordings archive ---------------------------------------------------
location = /recordings {
    return 308 /recordings/;
}

location /recordings/ {
    proxy_pass http://127.0.0.1:8899/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MP4 downloads are streamed, not buffered to a temp file.
    proxy_buffering          off;
    proxy_max_temp_file_size 0;
    send_timeout             3600s;
}

# --- 3. File downloads -------------------------------------------------------
# The portal emits root-relative links ("files/<room>/rec-*.mp4"), so the
# browser asks for /recordings/files/... and it is handled by the block above.
# This location keeps old root-absolute links (/files/...) working, which is
# what earlier builds of the portal produced. Safe to delete once no one has
# a bookmarked /files/ URL.
location /files/ {
    proxy_pass http://127.0.0.1:8899/files/;

    proxy_set_header Host              $host;
    proxy_buffering          off;
    proxy_max_temp_file_size 0;
    send_timeout             3600s;
}

# --- 4. The Element Web ESM module -------------------------------------------
# The record button is served by Element Web itself from /modules/recorder/,
# which is a plain directory inside the Element Web container. Nothing to
# proxy; listed here only so it is not mistaken for a missing piece.
#   /modules/recorder/index.js
#   /modules/recorder/manifest.json
#   /modules/recorder/package.json
#   /modules/recorder/locales/{ru,en}.json
