# =============================================================================
#  Matrix Element Call Recorder — nginx example (v2.1.0)
#
#  You normally do not need this file: `install.sh --install` generates the
#  same block at ${PLUGIN_DIR}/nginx/recorder.conf and applies it to a host
#  nginx automatically (with `nginx -t` and rollback on failure).
#
#  Use this file when you prefer to paste the locations by hand into the
#  `server { }` block that already serves your Element Web / Matrix domain.
#
#  WHERE IT GOES
#    Debian/Ubuntu : /etc/nginx/sites-available/<site>  (symlinked in sites-enabled)
#    RHEL/Alma     : /etc/nginx/conf.d/<site>.conf
#    Then          : nginx -t && systemctl reload nginx
#
#  PREREQUISITES
#    1. The plugin stack is installed and running:
#           bash install.sh --install /root/answers.env
#    2. Both services are published on loopback (PUBLISH_LOOPBACK_PORTS="true"):
#           ss -lntp | grep -E ':(8765|8899)\b'
#    3. If nginx runs in a container on the same docker network, replace
#       127.0.0.1 with the service names:
#           proxy_pass http://rec-controller:8765/;
#           proxy_pass http://rec-portal:8899/;
#
#  WHY THERE ARE NO PRIORITIES
#    nginx picks the longest matching prefix, so `location /recording/` never
#    captures /recordings/. No priority or ordering tricks are required.
# =============================================================================

# --- 1. Recording controller API ---------------------------------------------
# The button calls (same origin as Element Web):
#     POST /recording/api/record/start
#     POST /recording/api/record/stop
#     GET  /recording/api/record/status?roomId=...
#     GET  /recording/health
# The controller serves /api/record/... and /health, so the /recording prefix
# must be stripped. The trailing slash on proxy_pass does exactly that.
location = /recording {
    return 308 /recording/;
}

location /recording/ {
    proxy_pass http://127.0.0.1:8765/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Authorization: Bearer <matrix access token> must reach the controller.
    # nginx forwards it by default — do not strip it here. The controller
    # resolves the caller via /_matrix/client/v3/account/whoami and checks the
    # room power level before accepting a start.
}

# --- 2. Recordings archive ---------------------------------------------------
location = /recordings {
    return 308 /recordings/;
}

location /recordings/ {
    proxy_pass http://127.0.0.1:8899/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MP4 downloads are streamed, not buffered to a temp file.
    proxy_buffering          off;
    proxy_max_temp_file_size 0;
    send_timeout             3600s;
}

# --- 3. File downloads (legacy links) ----------------------------------------
location /files/ {
    proxy_pass http://127.0.0.1:8899/files/;

    proxy_set_header Host              $host;
    proxy_buffering          off;
    proxy_max_temp_file_size 0;
    send_timeout             3600s;
}

# --- 4. The Element Web ESM module -------------------------------------------
# The record button is served by Element Web itself from /modules/recorder/,
# a plain directory inside the Element Web container. Nothing to proxy here.
